input {

  beats {

    port => 5000

  }

}

filter {

  # Windows Security Events
  if [winlog][channel] == "Security" {

    mutate {

      add_field => {
        "event_type" => "windows_security_event"
      }

    }

  }

  # Failed Windows login - Event ID 4625
  if [winlog][event_id] == "4625" or [event][code] == "4625" {

    mutate {

      add_field => {
        "event_type" => "login_failed"
        "threat_type" => "Possible Brute Force"
      }

    }

  }

  # Successful Windows login - Event ID 4624
  if [winlog][event_id] == "4624" {

    mutate {

      add_field => {
        "event_type" => "login_success"
        "event_category" => "Authentication Success"
      }

    }

  }

  # Logoff - Event ID 4634
  if [winlog][event_id] == "4634" {

    mutate {

      add_field => {
        "event_type" => "logout"
      }

    }

  }

}

output {

  elasticsearch {

    hosts => ["http://elasticsearch:9200"]

    index => "siem-events-%{+YYYY.MM.dd}"

  }

  stdout {

    codec => rubydebug

  }

}